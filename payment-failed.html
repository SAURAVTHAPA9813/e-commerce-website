<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | E-Garden</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="other.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: "Montserrat", Arial, sans-serif;
            background: #f8f8f8;
            margin: 0;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .failed-container {
            max-width: 600px;
            margin: 80px auto 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            flex: 1;
        }

        .failed-icon {
            width: 80px;
            height: 80px;
            background: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
        }

        .failed-title {
            font-size: 2rem;
            font-weight: 700;
            color: #dc3545;
            margin-bottom: 10px;
        }

        .failed-subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }

        .error-details {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .error-detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f1aeb5;
        }

        .error-detail-row:last-child {
            border-bottom: none;
        }

        .order-number {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 600;
            margin: 20px 0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7cd49f 0%, #5eb880 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 212, 159, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .retry-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .retry-section h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .retry-section p {
            color: #856404;
            margin-bottom: 15px;
        }

        .payment-method-badge {
            display: inline-block;
            background: #dc3545;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .failed-container {
                margin: 40px 20px;
                padding: 20px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <a href="e garden.html">
            <img class="logo" src="/images/e garden logo1 copy.png" alt="Logo">
        </a>
        <nav id="main-nav-desktop">
            <ul id="navbar-desktop">
                <li><a href="shop.html">Plants</a></li>
                <li><a href="caretool.html">Care Tools</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div id="icons">
            <i class="fas fa-search" id="search-icon" onclick="toggleSearchOverlay()"></i>
            <a href="login.html"><i class="fas fa-user" id="user-icon"></i></a>
            <a href="cart.html" id="lg-bag"><i class="fal fa-shopping-bag"></i></a>
            <i class="fas fa-bars" id="menu-button"></i>
        </div>
    </header>

    <div class="failed-container">
        <div class="failed-icon">
            <i class="fas fa-times"></i>
        </div>

        <h1 class="failed-title">Payment Failed</h1>
        <p class="failed-subtitle">Your payment could not be processed. Please try again.</p>

        <div id="errorDetails">
            <!-- Error details will be populated by JavaScript -->
        </div>

        <div class="retry-section">
            <h3><i class="fas fa-redo"></i> What would you like to do?</h3>
            <p>You can retry the payment or choose a different payment method.</p>

            <div class="action-buttons">
                <a href="cart.html" class="btn btn-primary">
                    <i class="fas fa-shopping-cart"></i> Review Cart & Retry
                </a>
                <a href="contact.html" class="btn btn-secondary">
                    <i class="fas fa-headset"></i> Contact Support
                </a>
            </div>
        </div>

        <div class="action-buttons">
            <a href="e garden.html" class="btn btn-secondary">
                <i class="fas fa-home"></i> Continue Shopping
            </a>
        </div>
    </div>

    <script>
        // Handle payment failure callback
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const method = urlParams.get('method') || 'esewa';
            const orderNumber = urlParams.get('order');
            const reason = urlParams.get('reason');

            console.log('=== PAYMENT FAILED PAGE ===');
            console.log('Order:', orderNumber);
            console.log('Method:', method);
            console.log('Reason:', reason);

            // Display failure details
            displayErrorDetails(orderNumber, method, reason);

            // Keep cart intact for retry - don't clear anything
            console.log('Cart kept intact for retry');
        });

        function displayErrorDetails(orderNumber, method, reason) {
            const container = document.getElementById('errorDetails');

            const methodName = method === 'esewa' ? 'eSewa' : method === 'khalti' ? 'Khalti' : 'Card';

            // Get user-friendly error message
            let errorMessage = 'Payment could not be completed';
            let errorReasons = [
                'Insufficient balance in your ' + methodName + ' account',
                'Payment was cancelled by user',
                'Network connectivity issues',
                'Technical error during payment processing'
            ];

            if (reason) {
                if (reason === 'verification_failed') {
                    errorMessage = 'Payment verification failed';
                    errorReasons = [
                        'Payment signature could not be verified',
                        'Transaction details do not match',
                        'Payment was not completed with ' + methodName,
                        'Security check failed'
                    ];
                } else if (reason === 'verification_error') {
                    errorMessage = 'Could not verify payment with ' + methodName;
                    errorReasons = [
                        'Network error connecting to ' + methodName,
                        'Payment gateway is temporarily unavailable',
                        'Timeout during verification',
                        'Please check your ' + methodName + ' account for the transaction status'
                    ];
                } else {
                    // Use the reason as the error message
                    errorMessage = decodeURIComponent(reason);
                }
            }

            const orderNumberDisplay = orderNumber ? `
                <div class="order-number">
                    Order #${orderNumber}
                </div>
            ` : '';

            container.innerHTML = `
                ${orderNumberDisplay}

                <span class="payment-method-badge">
                    <i class="fas fa-exclamation-triangle"></i> ${methodName} Payment Failed
                </span>

                <div class="error-details">
                    ${orderNumber ? `
                    <div class="error-detail-row">
                        <span>Order Number:</span>
                        <span>${orderNumber}</span>
                    </div>
                    ` : ''}
                    <div class="error-detail-row">
                        <span>Payment Method:</span>
                        <span>${methodName}</span>
                    </div>
                    <div class="error-detail-row">
                        <span>Status:</span>
                        <span style="color: #dc3545; font-weight: 700;">${errorMessage}</span>
                    </div>
                </div>

                <p style="color: #666; margin-top: 20px; font-size: 0.95rem;">
                    <strong>Possible reasons for failure:</strong><br>
                    ${errorReasons.map(r => '• ' + r).join('<br>')}
                </p>

                <p style="color: #856404; margin-top: 20px; font-size: 0.95rem; background: #fff3cd; padding: 15px; border-radius: 8px;">
                    <i class="fas fa-info-circle"></i> <strong>Note:</strong> Your order has been created but payment was not completed.
                    ${orderNumber ? 'You can retry payment by going to your cart and placing the order again.' : 'Please try again.'}
                </p>
            `;
        }
    </script>

    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
