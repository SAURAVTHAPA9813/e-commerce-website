<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management - Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: #FAF9F6;
      color: #333;
      min-height: 100vh;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 128, 0, 0.1);
      flex-wrap: wrap;
    }

    .navbar h1 {
      color: #4CAF50;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: bold;
    }

    .navbar a {
      color: #4CAF50;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      transition: background 0.3s;
    }

    .navbar a:hover {
      background: rgba(76, 175, 80, 0.1);
    }

    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .header-section {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 128, 0, 0.1);
    }

    .header-section h2 {
      color: #4CAF50;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .controls-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-bar {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-input {
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 1rem;
      width: 300px;
      transition: border-color 0.3s;
    }

    .search-input:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
    }

    .filter-select {
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 1rem;
      background: white;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4CAF50, #81C784);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary:hover {
      transform: scale(1.05);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #666;
      border: 1px solid #ddd;
      padding: 0.5rem 1rem;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
      margin-right: 0.5rem;
    }

    .btn-secondary:hover {
      background: #e9e9e9;
    }

    .btn-danger {
      background: #f44336;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .btn-danger:hover {
      background: #d32f2f;
    }

    .users-table-container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 128, 0, 0.1);
      overflow-x: auto;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .users-table th,
    .users-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .users-table th {
      background-color: #f8f9fa;
      color: #4CAF50;
      font-weight: 600;
      position: sticky;
      top: 0;
    }

    .users-table tr:hover {
      background-color: rgba(76, 175, 80, 0.05);
    }

    .role-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .role-admin {
      background-color: #4CAF50;
      color: white;
    }

    .role-user {
      background-color: #2196F3;
      color: white;
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .status-active {
      background-color: #4CAF50;
      color: white;
    }

    .status-suspended {
      background-color: #ff9800;
      color: white;
    }

    .actions-cell {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background-color: white;
      margin: 2% auto;
      padding: 2rem;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #eee;
    }

    .modal-header h3 {
      color: #4CAF50;
      margin: 0;
    }

    .close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
      padding: 0.5rem;
      border-radius: 50%;
      transition: all 0.3s;
    }

    .close:hover {
      background: #f5f5f5;
      color: #333;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
    }

    .message {
      padding: 0.75rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      display: none;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 15px;
      padding: 1rem;
      text-align: center;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 128, 0, 0.1);
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: bold;
      color: #4CAF50;
    }

    .stat-label {
      color: #666;
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #666;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .controls-section {
        flex-direction: column;
        align-items: stretch;
      }

      .search-bar {
        flex-direction: column;
      }

      .search-input {
        width: 100%;
      }

      .users-table {
        font-size: 0.8rem;
      }

      .users-table th,
      .users-table td {
        padding: 0.5rem;
      }

      .actions-cell {
        flex-direction: column;
      }

      .modal-content {
        margin: 1% auto;
        padding: 1rem;
        width: 95%;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <h1><i class="fas fa-users"></i> User Management</h1>
    <a href="admin-dashboard.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
  </nav>

  <div class="container">
    <div class="header-section">
      <h2><i class="fas fa-users-cog"></i> User Management Dashboard</h2>
      <p>Manage all user accounts, roles, and permissions from this central dashboard.</p>
    </div>

    <!-- Statistics Summary -->
    <div class="stats-summary">
      <div class="stat-item">
        <div class="stat-number" id="totalUsers">0</div>
        <div class="stat-label">Total Users</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="activeUsers">0</div>
        <div class="stat-label">Active Users</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="adminUsers">0</div>
        <div class="stat-label">Admins</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="suspendedUsers">0</div>
        <div class="stat-label">Suspended</div>
      </div>
    </div>

    <!-- Controls Section -->
    <div class="controls-section">
      <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search users by name or email...">
        <select id="roleFilter" class="filter-select">
          <option value="">All Roles</option>
          <option value="admin">Admin</option>
          <option value="user">User</option>
        </select>
        <select id="statusFilter" class="filter-select">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="suspended">Suspended</option>
        </select>
      </div>
      <button class="btn-primary" onclick="openAddUserModal()">
        <i class="fas fa-plus"></i> Add New User
      </button>
    </div>

    <!-- Users Table -->
    <div class="users-table-container">
      <div id="message" class="message"></div>
      <div id="loadingIndicator" class="loading" style="display: none;">
        <i class="fas fa-spinner fa-spin"></i> Loading users...
      </div>
      <table class="users-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Users will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div id="editUserModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit User</h3>
        <button class="close" onclick="closeModal('editUserModal')">&times;</button>
      </div>
      <div id="editMessage" class="message"></div>
      <form id="editUserForm">
        <input type="hidden" id="editUserId">
        <div class="form-group">
          <label for="editFirstName">First Name</label>
          <input type="text" id="editFirstName" required>
        </div>
        <div class="form-group">
          <label for="editLastName">Last Name</label>
          <input type="text" id="editLastName" required>
        </div>
        <div class="form-group">
          <label for="editEmail">Email</label>
          <input type="email" id="editEmail" required>
        </div>
        <div class="form-group">
          <label for="editRole">Role</label>
          <select id="editRole" required>
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editStatus">Status</label>
          <select id="editStatus" required>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Update User</button>
        <button type="button" class="btn-secondary" onclick="closeModal('editUserModal')">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Add User Modal -->
  <div id="addUserModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Add New User</h3>
        <button class="close" onclick="closeModal('addUserModal')">&times;</button>
      </div>
      <div id="addMessage" class="message"></div>
      <form id="addUserForm">
        <div class="form-group">
          <label for="addFirstName">First Name</label>
          <input type="text" id="addFirstName" required>
        </div>
        <div class="form-group">
          <label for="addLastName">Last Name</label>
          <input type="text" id="addLastName" required>
        </div>
        <div class="form-group">
          <label for="addEmail">Email</label>
          <input type="email" id="addEmail" required>
        </div>
        <div class="form-group">
          <label for="addPassword">Password</label>
          <input type="password" id="addPassword" required minlength="6">
        </div>
        <div class="form-group">
          <label for="addRole">Role</label>
          <select id="addRole" required>
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Add User</button>
        <button type="button" class="btn-secondary" onclick="closeModal('addUserModal')">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = (window.API_BASE || 'http://localhost/e%20garden/ecommerce_backend').replace(/\/$/, '') + '/users.php';
    let allUsers = [];
    let filteredUsers = [];

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function() {
      loadUsers();
      loadStats();
      setupEventListeners();
    });

    // Setup event listeners
    function setupEventListeners() {
      document.getElementById('searchInput').addEventListener('input', filterUsers);
      document.getElementById('roleFilter').addEventListener('change', filterUsers);
      document.getElementById('statusFilter').addEventListener('change', filterUsers);
      document.getElementById('editUserForm').addEventListener('submit', handleEditUser);
      document.getElementById('addUserForm').addEventListener('submit', handleAddUser);
    }

    // API Functions
    async function apiRequest(url, options = {}) {
      try {
        const response = await fetch(url, {
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            ...options.headers
          },
          ...options
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || 'API request failed');
        }
        
        return data;
      } catch (error) {
        console.error('API Error:', error);
        throw error;
      }
    }

    // Load users from database
    async function loadUsers() {
      showLoading(true);
      try {
        const response = await apiRequest(`${API_URL}?action=getUsers`);
        allUsers = response.data || [];
        filteredUsers = [...allUsers];
        displayUsers();
      } catch (error) {
        showMessage('message', 'Failed to load users: ' + error.message, 'error');
      } finally {
        showLoading(false);
      }
    }

    // Load statistics
    async function loadStats() {
      try {
        const response = await apiRequest(`${API_URL}?action=getStats`);
        const stats = response.data;
        
        document.getElementById('totalUsers').textContent = stats.total || 0;
        document.getElementById('activeUsers').textContent = stats.active || 0;
        document.getElementById('adminUsers').textContent = stats.admins || 0;
        document.getElementById('suspendedUsers').textContent = stats.suspended || 0;
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    // Display users in table
    function displayUsers() {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      if (filteredUsers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #666;">No users found</td></tr>';
        return;
      }

      filteredUsers.forEach(user => {
        const row = document.createElement('tr');
        const status = user.status || 'active'; // Default to active if null
        
        row.innerHTML = `
          <td>${user.id}</td>
          <td>${user.firstName} ${user.lastName}</td>
          <td>${user.email}</td>
          <td><span class="role-badge role-${user.role}">${user.role.charAt(0).toUpperCase() + user.role.slice(1)}</span></td>
          <td><span class="status-badge status-${status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span></td>
          <td>${new Date(user.created_at).toLocaleDateString()}</td>
          <td class="actions-cell">
            <button class="btn-secondary" onclick="editUser(${user.id})">
              <i class="fas fa-edit"></i> Edit
            </button>
            <button class="btn-secondary" onclick="toggleUserStatus(${user.id})">
              <i class="fas fa-${status === 'active' ? 'ban' : 'check'}"></i> 
              ${status === 'active' ? 'Suspend' : 'Activate'}
            </button>
            <button class="btn-danger" onclick="deleteUser(${user.id})">
              <i class="fas fa-trash"></i> Delete
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Filter users
    function filterUsers() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const roleFilter = document.getElementById('roleFilter').value;
      const statusFilter = document.getElementById('statusFilter').value;

      filteredUsers = allUsers.filter(user => {
        const matchesSearch = 
          user.firstName.toLowerCase().includes(searchTerm) ||
          user.lastName.toLowerCase().includes(searchTerm) ||
          user.email.toLowerCase().includes(searchTerm);
        
        const matchesRole = !roleFilter || user.role === roleFilter;
        const userStatus = user.status || 'active';
        const matchesStatus = !statusFilter || userStatus === statusFilter;

        return matchesSearch && matchesRole && matchesStatus;
      });

      displayUsers();
    }

    // Modal functions
    function openAddUserModal() {
      document.getElementById('addUserModal').style.display = 'block';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
      // Reset forms
      const forms = document.querySelectorAll('#' + modalId + ' form');
      forms.forEach(form => form.reset());
      hideMessages();
    }

    function editUser(userId) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      document.getElementById('editUserId').value = user.id;
      document.getElementById('editFirstName').value = user.firstName;
      document.getElementById('editLastName').value = user.lastName;
      document.getElementById('editEmail').value = user.email;
      document.getElementById('editRole').value = user.role;
      document.getElementById('editStatus').value = user.status || 'active';

      document.getElementById('editUserModal').style.display = 'block';
    }

    async function handleEditUser(e) {
      e.preventDefault();
      
      const userId = parseInt(document.getElementById('editUserId').value);
      const userData = {
        id: userId,
        firstName: document.getElementById('editFirstName').value,
        lastName: document.getElementById('editLastName').value,
        email: document.getElementById('editEmail').value,
        role: document.getElementById('editRole').value,
        status: document.getElementById('editStatus').value
      };

      try {
        await apiRequest(`${API_URL}?action=updateUser`, {
          method: 'POST',
          body: JSON.stringify(userData)
        });

        showMessage('editMessage', 'User updated successfully!', 'success');
        setTimeout(() => {
          closeModal('editUserModal');
          loadUsers();
          loadStats();
        }, 2000);
      } catch (error) {
        showMessage('editMessage', 'Failed to update user: ' + error.message, 'error');
      }
    }

    async function handleAddUser(e) {
      e.preventDefault();
      
      const userData = {
        firstName: document.getElementById('addFirstName').value,
        lastName: document.getElementById('addLastName').value,
        email: document.getElementById('addEmail').value,
        password: document.getElementById('addPassword').value,
        role: document.getElementById('addRole').value
      };

      try {
        await apiRequest(`${API_URL}?action=addUser`, {
          method: 'POST',
          body: JSON.stringify(userData)
        });

        showMessage('addMessage', 'User added successfully!', 'success');
        setTimeout(() => {
          closeModal('addUserModal');
          loadUsers();
          loadStats();
        }, 2000);
      } catch (error) {
        showMessage('addMessage', 'Failed to add user: ' + error.message, 'error');
      }
    }

    async function toggleUserStatus(userId) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      const currentStatus = user.status || 'active';
      const newStatus = currentStatus === 'active' ? 'suspended' : 'active';
      
      if (confirm(`Are you sure you want to ${newStatus === 'suspended' ? 'suspend' : 'activate'} this user?`)) {
        try {
          await apiRequest(`${API_URL}?action=toggleStatus`, {
            method: 'POST',
            body: JSON.stringify({ id: userId })
          });

          showMessage('message', `User ${newStatus} successfully!`, 'success');
          loadUsers();
          loadStats();
        } catch (error) {
          showMessage('message', 'Failed to update user status: ' + error.message, 'error');
        }
      }
    }

    async function deleteUser(userId) {
      if (confirm('Are you sure you want to delete this user? This action cannot be undone.')) {
        try {
          await apiRequest(`${API_URL}?action=deleteUser`, {
            method: 'POST',
            body: JSON.stringify({ id: userId })
          });

          showMessage('message', 'User deleted successfully!', 'success');
          loadUsers();
          loadStats();
        } catch (error) {
          showMessage('message', 'Failed to delete user: ' + error.message, 'error');
        }
      }
    }

    // Utility functions
    function showLoading(show) {
      document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
    }

    function showMessage(elementId, message, type) {
      const messageEl = document.getElementById(elementId);
      messageEl.textContent = message;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'block';
      
      setTimeout(() => {
        messageEl.style.display = 'none';
      }, 5000);
    }

    function hideMessages() {
      const messages = document.querySelectorAll('.message');
      messages.forEach(msg => msg.style.display = 'none');
    }

    // Close modals when clicking outside
    window.onclick = function(event) {
      const modals = document.querySelectorAll('.modal');
      modals.forEach(modal => {
        if (event.target === modal) {
          modal.style.display = 'none';
        }
      });
    }
  </script>
  <script src="js/config.js"></script>
</body>
</html>
